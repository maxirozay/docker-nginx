<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <!-- The app is down for a few seconds during a deploy: retry until it answers. -->
    <meta http-equiv="refresh" content="2" />
    <title>Updating</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #fafafa;
        --fg: #1a1a1a;
        --muted: #6b6b6b;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #141414;
          --fg: #ededed;
          --muted: #9a9a9a;
        }
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 0 16px;
        background: var(--bg);
        color: var(--fg);
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        text-align: center;
      }
      h1 {
        margin: 0 0 8px;
        font-size: 1.25rem;
        font-weight: 600;
      }
      p {
        margin: 0;
        color: var(--muted);
      }
      .dots {
        display: flex;
        justify-content: center;
        gap: 8px;
        margin-bottom: 20px;
      }
      .dots span {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: var(--fg);
        opacity: 0.2;
        animation: pulse 1s ease-in-out infinite;
      }
      .dots span:nth-child(2) {
        animation-delay: 0.15s;
      }
      .dots span:nth-child(3) {
        animation-delay: 0.3s;
      }
      @keyframes pulse {
        0%,
        70%,
        100% {
          opacity: 0.2;
          transform: scale(1);
        }
        35% {
          opacity: 1;
          transform: scale(1.3);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .dots span {
          animation-name: fade;
        }
        @keyframes fade {
          35% {
            opacity: 1;
          }
        }
      }
    </style>
  </head>
  <body>
    <main>
      <div class="dots" aria-hidden="true"><span></span><span></span><span></span></div>
      <h1 id="title">Updating</h1>
      <p id="text">We're installing an update. This page reloads by itself in a moment.</p>
    </main>
  </body>
</html>
